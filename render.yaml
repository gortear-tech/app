services:
  - type: web
    name: cadencia-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --workspace @cadencia/shared run build && npm --workspace @cadencia/backend run build
    startCommand: npm --workspace @cadencia/backend run start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://cadencia-web.onrender.com
      - key: MOBILE_DEEP_LINK_BASE_URL
        value: cadencia:///
      - key: META_OAUTH_REDIRECT_URI
        value: https://cadencia-backend.onrender.com/auth/meta/callback
      - key: META_GRAPH_VERSION
        value: v24.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CLIENT_TOKEN
        sync: false

  - type: web
    name: cadencia-web
    runtime: static
    buildCommand: npm ci --include=dev && npm --workspace @cadencia/shared run build && npm --workspace @cadencia/mobile run build
    staticPublishPath: mobile/dist
    autoDeployTrigger: commit
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://cadencia-backend.onrender.com
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: EXPO_PUBLIC_META_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
